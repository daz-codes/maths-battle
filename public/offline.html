<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline · MatheMinute</title>
  <style>
    body { margin: 0; min-height: 100dvh; display: grid; place-content: center; gap: 1rem; padding: 1rem;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; text-align: center;
      background: #fff; color: oklch(26% 0.05 264); }
    @media (prefers-color-scheme: dark) { body { background: oklch(20% 0.03 264); color: oklch(96% 0.01 258); } }
    .logo { justify-self: center; padding: 0.35rem 1.4rem; border-radius: 0.9rem; background: #0085ca; color: #fff;
      font-size: 2rem; font-weight: 900; letter-spacing: -0.06em; }
    .logo span { color: #b0fc38; }
    h1 { margin: 0; font-size: 2.25rem; font-weight: 900; letter-spacing: -0.035em; }
    p { margin: 0; font-size: 1.15rem; font-weight: 700; }
    button { justify-self: center; min-height: 3.5rem; padding: 0.6rem 1.5rem; border: 4px solid currentColor;
      border-radius: 0.9rem; background: #b0fc38; color: oklch(26% 0.05 264); font: inherit; font-size: 1.25rem; font-weight: 900; }
  </style>
</head>
<body>
  <div class="logo">MATHEM<span>!</span>NUTE<span>!</span></div>
  <h1>You're offline</h1>
  <p>Connect to the internet to do today's minute.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
