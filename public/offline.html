<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline · MatheMinute</title>
  <style>
    body { margin: 0; min-height: 100dvh; display: grid; place-content: center; gap: 1rem; padding: 1rem;
      font-family: "Avenir Next", Avenir, "Segoe UI", ui-sans-serif, system-ui, sans-serif; text-align: center;
      background: #fffef9; color: #24251f; }
    @media (prefers-color-scheme: dark) { body { background: #121310; color: #f4f4ea; } }
    .logo { display: inline-flex; align-items: center; gap: 0.6rem; justify-self: center; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.045em; }
    .logo { font-weight: 500; letter-spacing: -0.04em; }
    .logo img { width: 2.6rem; height: 2.6rem; border-radius: 10px; }
    .logo strong { font-weight: 700; color: #e5139a; }
    @media (prefers-color-scheme: dark) { .logo strong { color: #ff5cc6; } }
    h1 { margin: 0; font-size: 2.25rem; font-weight: 700; letter-spacing: -0.045em; }
    p { margin: 0; font-size: 1.1rem; color: #6f7064; }
    button { justify-self: center; min-height: 3.25rem; padding: 0.6rem 1.4rem; border: 2px solid #24251f; border-radius: 10px;
      background: #5dff7a; color: #24251f; font: inherit; font-size: 1.05rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="logo"><img src="/favicon.svg" alt=""><span>Mathe<strong>Minute</strong></span></div>
  <h1>You're offline</h1>
  <p>Connect to the internet to do today's minute.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
