<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline · MatheMinute</title>
  <style>
    :root { --paper: #f3f6fb; --ink: #152541; --muted: #596a80; --accent: #2858e8; --on-accent: #fff; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #10121b; --ink: #f5f6fb; --muted: #afb5cc; --accent: #ff6fcf; --on-accent: #14191a; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-content: center; gap: 1rem; padding: 1.5rem;
      font-family: "Manrope", ui-sans-serif, system-ui, sans-serif; text-align: center; background: var(--paper); color: var(--ink); }
    .logo { margin-bottom: 1.5rem; font-size: 24px; font-weight: 800; letter-spacing: -1.5px; }
    .logo__minute { font-weight: 500; }
    h1 { margin: 0; font-size: 2.25rem; font-weight: 800; letter-spacing: -0.045em; }
    p { max-width: 22rem; justify-self: center; margin: 0; font-size: 1rem; line-height: 1.6; color: var(--muted); }
    button { min-height: 50px; padding: 0.6rem 1.4rem; border: 0; border-radius: 12px;
      background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 800; cursor: pointer; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  </style>
</head>
<body>
  <div class="logo">Mathe<span class="logo__minute">Minute</span></div>
  <h1>You're offline</h1>
  <p>Connect to the internet to load this page. Games you've already opened can still be played offline.</p>
  <form action="" method="get" aria-label="Retry loading this page">
    <button type="submit">Try again</button>
  </form>
</body>
</html>
