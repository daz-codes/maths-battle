#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  destroy_expired_sessions:
    command: "Session.where(created_at: ...Session::LIFETIME.ago).delete_all"
    schedule: every day at 3am
  destroy_abandoned_guests:
    command: "User.destroy_abandoned_guests"
    schedule: every day at 4am
  forget_old_battles:
    command: "LiveGame.where(created_at: ...1.day.ago).destroy_all"
    schedule: every day at 5am
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
